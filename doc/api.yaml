openapi: 3.0.0  
info:
  title: WasaPhoto APIs
  description: |
   Keep in touch with your friends by sharing photos of special moments, thanks to WASAPhoto! You can
   upload your photos directly from your PC, and they will be visible to everyone following you.
  version: 1.0.0
tags:
  - name: Account
    description: Authentication and session management
  - name: Profile
    description: User identity and social statistics
  - name: Social
    description: Following and banning logic
  - name: Posts
    description: Image uploading and posts management
servers:
  - url: http://localhost:3000
  
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
          type: object
          description: The request body containing the user credentials (username and Password) required to authenticate an existing user or create a new account.
          title: LoginRequest
          required:
            - username
            - Password
            - IsSignUp
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^.*?$'
              description: The unique identifier for the user.
              example: Eren_Yeager
            Password:
              type: string
              format: password
              minLength: 8
              pattern: '^.*?$'
              description: The user's secret password
              example: "Secret123!"
            IsSignUp:
              type: boolean
              example: false
              description: Flag indicating whether the user is attempting a new registration (true) or a standard login (false).

    username:
          type: object
          description: A string that uniquely identifies the user's profile on WasaPhoto.
          title: username
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^.*?$'
              description: The username 
              example: Eren_Yeager
    
    Post:
      type: object
      properties:
        PostId:
          type: string
          example: "inenfnficnive"
        username:
          type: string
          example: "Eren_Yeager"
        Caption:
          type: string
          example: "A beautiful sunset"
        LikesNumber:
          type: integer
        CommentsNumber:
          type: integer
        DateOfUpload:
          type: string
          format: date-time
        IsLikedByMe:
          type: boolean
    UserProfile:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^.*?$'
          example: "Eren_Yeager"
          description: The username 
        Bio:
          type: string
          pattern: '^.*?$'
          example: "Hi I'm Eren_Yeager and I'm the Founding Titan :) "
          description: The username 
        FollowersCount:
          type: integer
        FollowingCount:
          type: integer
        PostsCount:
          type: integer
        IsFollowing:
          type: boolean
        IsBannedByMe:
          type: boolean
        UserPosts: 
          type: array
          items:
            $ref: "#/components/schemas/Post"
    PhotoStreamComponent:
      type: object
      title: PhotoStream component
      description: A single component in the photostream with pre-calculated stats.
      properties:
        postId: 
          type: string
          example: "152164"
        username:
          type: string
          description: "Owner of the photo"
          example: "Eren_Yeager"
        LikesNumber:
          type: integer
          example: 15
        CommentsNumber:
          type: integer
          example: 3
        DateOfUpload:
          type: string
          format: date-time
          example: 2018-03-20T09:12:28Z
        IsLikedByMe:
          type: boolean
          description: "Indicates if the logged-in user has already liked this photo"
          example: true
    
  
    CommentContent:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "This is a great post!"
    Comment:
      type: object
      properties:
        commentId:
          type: integer
        postId:
          type: string
        authorUsername:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
  
  parameters: 
    username:
      name: username
      in: path
      required: true
      description: The username is a string that uniquely identifies a user in WasaPhoto.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    target_username:
      name: target_username
      in: path
      required: true
      description: The user receiving the action
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    actor_username:
      name: actor_username
      in: path
      required: true
      description: The user who performs the action
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    postId:
      name: postId
      in: path
      required: true
      description: The unique identifier of the post
      schema:
        type: string
    
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
      description: The unique ID of the comment.
    Limit:
      name: limit
      in: query
      description: Numero massimo di foto da restituire
      schema:
        type: integer
        default: 10
    Offset:
      name: offset
      in: query
      description: Numero di foto da saltare (per la pagina successiva)
      schema:
        type: integer
        default: 0
  responses:
    BadRequest:
      description: |
        Bad Request : The request was not compliant with the documentation
        (eg. missing fields, etc).
    InternalServerError:
      description: |
        Internal Server Error : The server encountered an internal error.
        Further info in server logs.      
paths:
  /session:
    post:
      tags:
        - Account
      summary: Logs in or registers the user
      description: | 
        If the user does not exist, a new account and profile are created (Sign Up).
        If the user exists, credentials are verified (Login).
        In both cases, a temporary session token is returned.
      operationId: doLogin
      requestBody:
        description: User credentials for authentication
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: |
            Ok : User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: an object
                properties:
                  Identifier:
                    type: string
                    description: the identifier
                    example: "abcdef012345"
        '201':
          description: |
            Created : User log-in action successful, a new user is created
          content:
            application/json:
              schema:
                type: object
                description: an object
                properties:
                  Identifier:
                    type: string
                    description: the identifier
                    example: "abcdef012345"
        '400':
          $ref: "#/components/responses/BadRequest"

          
        '401':
          description: |
            Unauthorized: Invalid username or password. 
            For security reasons, the system does not specify if the username 
            exists or if the password is incorrect. 
        '409':
          description: |
            Conflict: username already taken during signup
        '500':
          $ref: "#/components/responses/InternalServerError"  
    
    delete:
      tags:
        - Account
      security:
        - bearerAuth: [] 
      operationId: doLogout
      summary: Logout the current user
      responses:
        '204':
          description: User successfully logged out (No Content)
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          description: Internal server error

  
  /users/{username}:
    get:
      tags:
        - Profile
      security:
        - bearerAuth : []
      operationId: getUserProfile
      summary: Get user profile data
      description: |
        Returns the profile details, statistics, and photos of the specified user.
        If the requester is banned by the owner (or vice versa), it returns a 403 Forbidden.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the profile to retrieve.
          schema:
            type: string
            minLength: 3
            maxLength: 30
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Access denied due to blocking/banning.
        '404':
          description: Not Found - User does not exist.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/:
    parameters:
      - $ref: "#/components/parameters/username"
    delete:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: deleteUser
      summary: Delete a user.
      description: |
        Deletes the user with the specified username.
      responses:
        '204':
          description: Delete successfully performed.
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          description: |
            NotFound : User with specified username not found in the system.
        '500':
          $ref: "#/components/responses/InternalServerError"  
  /users/{username}/stream:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
    get:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: getMyStream
      summary: Ottiene lo stream personalizzato
      description: |
        Restituisce le foto caricate dagli utenti seguiti in ordine cronologico inverso.
        Supporta la paginazione tramite limit e offset.
      responses:
        '200': 
          description: OK
          content: 
            application/json:
              schema:
                type: object
                properties:
                  PhotoStream:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoStreamComponent"
                  TotalResults:
                    type: integer
                    description: Numero totale di post disponibili nello stream
        '403':
          description: Forbidden - Non puoi vedere lo stream di questo utente (es. ban)
        '404':
          description: Utente non trovato
  /users/{username}/username:
    parameters:
      - $ref: "#/components/parameters/username"
    put:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: setMyusername
      summary: Modify the username of the given user.
      description: |
        Modifies an existing user by replacing the old username 
        with the new username contained in the request body.
        The new username will be returned in the response.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/username"
      responses:
        '200':
          description: |
            OK : username successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/username"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':  
          description: |
            Unauthorized : The id passed does not authorize the user to perform the operation.
        '404':
          description: |
            NotFound : User not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/posts:
    parameters:
      - $ref: "#/components/parameters/username"
    post:
      tags:
        - Posts
      summary: Uploads a new post
      description: |
        Creates a new post containing an image and an optional caption.
        The 'username' in the path must match the identity of the authenticated user.
        The image is sent as a binary part of a multipart/form-data request.
      operationId: uploadPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "The image file to upload (supported formats: JPEG, PNG.)"
                caption:
                  type: string
                  description: An optional description for the post.
                  maxLength: 500
              required:
                - file
      responses:
        '201':
          description: Post created successfully. Returns the new post metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        '400':
          description: Bad Request. Possible causes include invalid file format, file too large, or missing mandatory fields.
        '401':
          description: Unauthorized. Invalid or missing session token.
        '403':
          description: Forbidden. The authenticated user is not allowed to post as the specified username.
        '404':
          description: User not found.
        '500':
          description: Internal Server Error.
  /users/{username}/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
    get:
      tags:
        - Posts
      operationId: getPhoto
      summary: Gets the photo of the post with the specified Id
      description: |
        Retrieves the binary image file associated with a specific post.
        Access is restricted if a ban relationship exists between the requester and the owner.
      security: []
      responses:
        '200': 
          description: Photo retrieved successfully.
         
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
                description: The binary image data
          
            
        '404':
          description: |
            Not Found:
            - The user specified in the URL does not exist.
            - The post (photo) specified in the URL does not exist on the server.
  
          
    delete:
      tags:
        - photos
      security:
        - bearerAuth : []
      operationId: deletePhoto
      summary: Deletes a photo from the user uploaded photos.
      description: |
        Deletes the photo with the specified id from the system.
      responses:
        '204':
          description: |
            No Content : Photo deleted successfully.
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          description: |
            Unauthorized : The id passed is not allowed to delete this photo.
        '404':
          description: | 
            Not Found : Photo with specified Id not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/posts/{postId}/likes/{actor_username}:
    parameters:
       - $ref: "#/components/parameters/username"
       - $ref: "#/components/parameters/postId"
       - $ref: "#/components/parameters/actor_username"
    put:
      tags:
        - Likes
      summary: Add a like to a post
      operationId: likePost
      description: |
        Creates a like relationship. This operation is idempotent.
        It fails with 403 if a ban exists between the actor and the target.
      responses:
        '204':
          description: Like added successfully.
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          description: Unauthorized - Invalid or missing session token.
        '403':
          description: Forbidden - Action blocked by a ban relationship.
        '404':
          description: Post or user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Likes
      summary: Remove a like from a post
      operationId: unlikePost
      description: |
        Deletes an existing like. 
        Returns 404 if the like does not exist.
      responses:
        '204':
          description: Like removed successfully.
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          description: Like not found or post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

  /users/{username}/posts/{postId}/likes:
    parameters:
     - $ref: "#/components/parameters/username"
     - $ref: "#/components/parameters/postId"
     - $ref: "#/components/parameters/actor_username"
    get:
      tags:
        - Likes
      summary: Get the list of likes for a post
      operationId: getLikes
      description: |
        Returns a list of usernames who liked the post.
        Access is forbidden if the requester is banned by the post owner.
      responses:
        '200':
          description: A list of usernames.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "john_doe"
        '403':
          description: Forbidden - You cannot view these likes due to a ban.
        '404':
          description: Post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  /users/{username}/followers/{actor_username}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/actor_username"
    put:
      tags:
        - Social
      summary: Follow a user
      description: |
        Creates a follow relationship between the actor and the target user.
        The actor_username must match the authenticated user's identity.
      operationId: followUser
      responses:
        '204':
          description: User followed successfully.
        '401':
          description: Unauthorized (invalid or missing session token).
        '403':
          description: Forbidden (e.g. a ban exists).
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.

    delete:
      tags:
        - Social
      summary: Unfollow a user
      description: |
        Removes the follow relationship between the actor and the target user.
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/target_username'
        - $ref: '#/components/parameters/actor_username'
      responses:
        '204':
          description: User unfollowed successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden .
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.
  
  /users/{username}/bans/{target_username}:
    parameters:
      - $ref: "#/components/parameters/target_username"
      - $ref: "#/components/parameters/username"
    put:
      tags:
        - Social
      summary: Bans a user
      description: |
        Creates a ban relationship between the actor and the target user.
        The actor_username must match the authenticated user's identity.
      operationId: banUser
      responses:
        '204':
          description: User banned successfully.
        '401':
          description: Unauthorized (invalid or missing session token).
        '403':
          description: Forbidden (e.g. a ban exists).
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.

    delete:
      tags:
        - Social
      summary: Unbans a user
      description: |
        Removes the ban relationship between the actor and the target user.
      operationId: unbanUser
      responses:
        '204':
          description: User unbanned successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.
      
  /users/{username}/posts/{postId}/comments:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
    
    post:
      tags:
        - Comments
      summary: Add a comment to a post
      operationId: addComment
      description: |
        Creates a new comment on a post. 
        Fails with 403 if the author is banned by the post owner or vice versa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentContent"
      responses:
        '201':
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          description: Forbidden - Action blocked by a ban relationship.
        '404':
          description: Post or user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

    get:
      tags:
        - Comments
      summary: Get all comments of a post
      operationId: getComments
      description: Returns a list of comments. Access is blocked if a ban exists.
      responses:
        '200':
          description: A list of comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        '403':
          description: Forbidden - Access blocked by a ban.
        '404':
          description: Post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

  /users/{username}/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
      - $ref: "#/components/parameters/commentId"
    
    delete:
      tags:
        - Comments
      summary: Remove a comment
      operationId: deleteComment
      description: |
        Deletes a comment. 
        Only the comment author or the post owner can delete it.
      responses:
        '204':
          description: Comment deleted successfully.
        '403':
          description: Forbidden - You do not have permission to delete this comment.
        '404':
          description: Comment or post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
    
  



    




  
    

      
    
      
      









