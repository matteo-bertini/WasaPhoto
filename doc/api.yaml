openapi: 3.0.0  
info:
  title: WasaPhoto APIs
  description: |
   Keep in touch with your friends by sharing photos of special moments, thanks to WASAPhoto! You can
   upload your photos directly from your PC, and they will be visible to everyone following you.
  version: 1.0.0
security:
  - BearerAuth: []
tags:
  - name: Authentication
    description: Authentication and session management
  - name: User
    description: User identity and social statistics
  - name: Social
    description: Following and banning logic
  - name: Posts
    description: Image uploading and posts management
servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
          type: object
          description: The request body containing the user credentials (username and password) required to authenticate an existing user or create a new account.
          title: LoginRequest
          required:
            - username
            - password
            - isSignUp
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^[a-zA-Z0-9_]{3,30}$'
              description: The unique identifier for the user.
              example: eyeager
            password:
              type: string
              format: password
              minLength: 8
              maxLength: 72
              pattern: '^[a-zA-Z0-9!@#$%^&*()_+=-]{8,72}$'
              description: The user's secret password
              example: "Secret123!"
            isSignUp:
              type: boolean
              example: false
              description: Flag indicating whether the user is attempting a new registration (true) or a standard login (false).

    LoginResponse:
      type: object
      title: LoginResponse
      description: The response body containing the session token.
      properties:
        sessionToken:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 1
          maxLength: 128
          description: The unique identifier for the session.
          example: 3Cf7kQ6YcFR3H4evd65CIWlb7e

    Username:
          type: object
          description: A string that uniquely identifies the user's profile on WasaPhoto.
          title: username
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^[a-zA-Z0-9_]{3,30}$'
              description: The username 
              example: eyeager
    UserProfile:
      type: object
      description: "Detailed information about a user profile, including social counters and posts."
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]{3,30}$'
          example: "eyeager"
          description: "Unique identifier for the user" 
        bio:
          type: string
          minLength: 0
          maxLength: 160
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: "A brief biography or status of the user"
          example: "Hi I'm eyeager and I'm the Founding Titan :) "
        followersCount:
          type: integer
          description: "The total number of users following this profile."
          example: 105
        followingCount:
          type: integer
          description: "The total number of profiles this user is following."
          example: 102
        postsCount:
          type: integer
          description: "The total number of posts published by this user."
          example: 12
        isFollowing:
          type: boolean
          description: "True if the authenticated user follows this profile"
        isBannedByMe:
          type: boolean
          description: "True if the authenticated user has blocked this profile"
        userPosts: 
          type: array
          description: "A collection of the most recent posts created by this user."
          minItems: 0
          maxItems: 10000
          items:
            $ref: "#/components/schemas/Post"
    Post:
      type: object
      description: "Represents a single post with metadata regarding date, caption, and interaction statistics."
      properties:
        postId:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 1
          maxLength: 64
          description: "The unique identifier of the post."
          example: "7b259fbu74ncp6cuiiein"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]{3,30}$'
          example: "eyeager"
          description: "Unique identifier for the user" 
        caption:
          type: string
          minLength: 0
          maxLength: 2200
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: "The text description accompanying the post"
          example: "A beautiful sunset"
        likesNumber:
          type: integer
          description: "The total number of likes this post has received."
          example: 42
        commentsNumber:
          description: "The total number of comments left on this post."
          type: integer
          example: 2
        dateOfUpload:
          type: string
          description: "The timestamp indicating when the post was uploaded."
          format: date-time
          minLength: 1
          maxLength: 10000
          pattern: '^[a-zA-Z0-9-T:.\+Z]+$'
        isLikedByMe:
          type: boolean
          description: "True if the authenticated user liked this post"
    StreamPost:
      type: object
      description: "A post model optimized for the feed, including an indicator for system-suggested content."
      properties:
        postId:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 1
          maxLength: 64
          description: "The unique identifier of the post."
          example: "7b259fbu74ncp6cuiiein"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]{3,30}$'
          example: "eyeager"
          description: "Unique identifier for the user" 
        caption:
          type: string
          minLength: 0
          maxLength: 2200
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: "The text description accompanying the post"
          example: "A beautiful sunset"
        likesNumber:
          type: integer
          description: "The total number of likes this post has received."
          example: 42
        commentsNumber:
          type: integer
          description: "The total number of comments left on this post."
          example: 2
        dateOfUpload:
          type: string
          description: "The timestamp indicating when the post was uploaded."
          format: date-time
          minLength: 1
          maxLength: 10000
          pattern: '^[a-zA-Z0-9-T:.\+Z]+$'
        isLikedByMe:
          type: boolean
          description: "True if the authenticated user liked this post"
        isSuggested:
          type: boolean
          description: True if the post is from a user not followed (Content Discovery).
          example: true
        
   
    CommentContent:
      type: object
      description: "Object containing the text content for a new comment request."
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[\s\S]*$'
          description: "The text content of the new comment."
          example: "This is a great post!"
    Comment:
      type: object
      description: "Represents a complete comment including commentId, postId, authorUsername, content and creation timestamp."
      properties:
        commentId:
          type: string
          pattern: '^[0-9]+$'
          minLength: 1
          maxLength: 64
          description: "The unique identifier of the comment (numeric, auto-incrementing)."
          example: "42"
        postId:
          type: string
          description: "The unique identifier of the post this comment belongs to."
          pattern: '^[a-zA-Z0-9]+$'
          minLength: 1
          maxLength: 64
        authorUsername:
          description: "The username of the comment's author."
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]{3,30}$'
        content:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[\s\S]*$'
          description: "The text content of the comment."
        createdAt:
          type: string
          format: date-time
          minLength: 1
          maxLength: 10000
          pattern: '^[a-zA-Z0-9-T:.\+Z]+$'
          description: "The timestamp indicating when the comment was created."
  
  parameters: 
    username:
      name: username
      in: path
      required: true
      description: The username is a string that uniquely identifies a user in WasaPhoto.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^[a-zA-Z0-9_]{3,30}$'
        example: eyeager
    postId:
      name: postId
      in: path
      required: true
      description: The unique identifier of the post
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9]+$'
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[0-9]+$'
        example: "42"
      description: The unique identifier of the comment (numeric, auto-incrementing).
  responses:
    BadRequest:
      description: |
        Bad Request : The request was not compliant with the documentation
        (eg. missing fields, etc).
    InternalServerError:
      description: |
        Internal Server Error : The server encountered an internal error.
        Further info in server logs.      
paths:
  /session:
    post:
      tags:
        - Authentication
      summary: Logs in or registers the user
      description: | 
        If the user does not exist, a new account and profile are created (Sign Up).
        If the user exists, credentials are verified (Login).
        In both cases, a temporary session token is returned.
      operationId: doLogin
      security: []
      requestBody:
        description: User credentials for authentication
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: |
            Ok : User log-in action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '201':
          description: |
            Created : User log-in action successful, a new user is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          description: |
            Unauthorized: Invalid username or password. 
            For security reasons, the system does not specify if the username 
            exists or if the password is incorrect. 
        '409':
          description: |
            Conflict: username already taken during signup
        '500':
          $ref: "#/components/responses/InternalServerError"  
    
    delete:
      tags:
        - Authentication

      operationId: doLogout
      summary: Logout the current user
      description: "Invalidates the current user session and revokes the active authentication token, effectively logging the user out."
      responses:
        '204':
          description: User successfully logged out (No Content)
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          $ref: "#/components/responses/InternalServerError"
  /stream:
    get:
      summary: Get user's hybrid stream
      description: >
          Returns a paginated list of posts. The feed prioritizes posts from followed users. 
          If the following posts are fewer than the limit, it fills the remaining slots 
          with suggested (popular/recent) posts, excluding banned users.
      operationId: getStream
      tags:
        - Stream
      parameters:
        - name: offset
          in: query
          required: false
          description: "The number of items to skip (for pagination)."
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          description: The number of items to return per page.
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: "A list of posts successfully retrieved."
          content:
            application/json:
              schema:
                  type: array
                  minItems: 0
                  maxItems: 10000
                  description: "List of posts that make up the personalized content stream for the user."
                  items:
                    $ref: '#/components/schemas/StreamPost'
        '401':
          description: "Unauthorized - Session token is missing or invalid"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}:
    parameters: 
      - $ref: "#/components/parameters/username"
    get:
      tags:
        - User
      operationId: getUserProfile
      summary: Get user profile data
      description: |
        Returns the profile details, statistics, and posts of the specified user.
        If the requester is banned by the owner (or vice versa), it returns a 403 Forbidden.
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Access denied due to blocking/banning.
        '404':
          description: Not Found - User does not exist.
        '500':
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - User
      summary: Update username
      operationId: setMyUserName
      description: Changes the username for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Username"
      responses:
        '204':
          description: Username updated successfully.
        '400':
          description: Invalid username format.
        '403':
          description: Forbidden - You can only change your own username.
        '409':
          description: Conflict - Username already taken.
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - User
      operationId: deleteUser
      summary: Delete user account
      description: |
        Permanently deletes the user's account and all associated data (posts, likes, comments, relationships).
        This action is irreversible. The requester must be the owner of the account.
      responses:
        '204':
          description: Delete successfully performed.
        '401':
          description: Unauthorized - Token missing or invalid.
        '403':
          description: Forbidden - You can only delete your own account.
        '404':
          description: |
           User not found.
        '500':
          $ref: "#/components/responses/InternalServerError"  
  
  /users/{username}/posts:
    parameters:
      - $ref: "#/components/parameters/username"
    post:
      tags:
        - Posts
      summary: Uploads a new post
      description: |
        Creates a new post containing an image and an optional caption.
        The 'username' in the path must match the identity of the authenticated user.
        The image is sent as a binary part of a multipart/form-data request.
      operationId: uploadPost
      requestBody:
        required: true
        description: "Form data for uploading a new post, containing the binary image file and an optional caption."
        content:
          multipart/form-data:
            schema:
              type: object
              description: "Schema definition for the multipart form data required to upload a photo post."
              properties:
                file:
                  type: string
                  format: binary
                  description: "The image file to upload (supported formats: JPEG, PNG.)"
                  minLength: 1
                  maxLength: 10000
                  pattern: '^[\s\S]+$'
                caption:
                  type: string
                  description: An optional description for the post.
                  minLength: 0
                  maxLength: 2200
                  pattern: '^[^\x00-\x1F\x7F]*$'

                  
              required:
                - file
      responses:
        '201':
          description: Post created successfully. Returns the new post metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        '400':
          description: Bad Request. Possible causes include invalid file format, file too large, or missing mandatory fields.
        '401':
          description: Unauthorized. Invalid or missing session token.
        '403':
          description: Forbidden. The authenticated user is not allowed to post as the specified username.
        '404':
          description: User not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
    get:
      tags:
        - Posts
      operationId: getPostPhoto
      security: []
      summary: Retrieves the binary image of a post
      description: "Fetches and returns the raw binary data of the image associated with the specified post. Does not return JSON metadata."
      responses:
        '200':
          description: Photo retrieved successfully.
          content:
            image/jpeg:
              schema:
                type: string
                description: "The binary image content of the requested photo."
                format: binary
                minLength: 1
                maxLength: 10000
                pattern: '^[\s\S]+$'
        '404':
          description: Photo not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Posts
      operationId: deletePost
      summary: Deletes a post
      description: "Permanently deletes a specific post from the user's profile, including all its associated resources such as comments and likes."
      responses:
        '204':
          description: Deleted.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - You are not the owner.
        '404':
          description: Post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
          

  /users/{username}/posts/{postId}/likes:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
    get:
      tags:
        - Likes
      summary: Get the list of likes for a post
      operationId: getLikes
      description: |
        Returns a list of usernames who liked the post.
        Forbidden if a ban relationship exists between the requester and the post owner.
      responses:
        '200':
          description: A list of usernames.
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10000
                description: "List of usernames of users who liked this specific post."
                items:
                  $ref: "#/components/schemas/Username"
        '401':
          description: Unauthorized.
                  
        '403':
          description: Forbidden - Access denied due to ban.
        '404':
          description: Post not found or username mismatch.
        '500':
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Likes
      summary: Add a like to a post
      operationId: likePost
      description: |
        Creates a like relationship. Idempotent operation.
        The actor identity is derived from the JWT.
      responses:
        '204':
          description: Like added successfully.
        '401':
          description: Unauthorized - Invalid token.
        '403':
          description: Forbidden - Ban exists between actor and post owner.
        '404':
          description: Post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Likes
      summary: Remove a like from a post
      operationId: unlikePost
      description: Deletes an existing like.
      responses:
        '204':
          description: Like removed successfully (even if it didn't exist).
        '401':
          description: Unauthorized.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/following:
    parameters:
      - $ref: "#/components/parameters/username"
    get:
      tags: 
        - Social
      summary: Get the list of following
      operationId: getFollowing
      description: Returns an array of usernames that the specified user is currently  following. 
        Visible to any authenticated user, unless a ban exists between the two parties.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10000
                description: "List of users followed by the specified profile."
                items:
                  $ref: '#/components/schemas/Username'
        '401':
          description: Unauthorized - Token missing or invalid
        '403':
          description: Forbidden - Access denied due to a ban between the two users
        '404':
          description: Not Found - The specified user does not exist
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/followers:
    parameters:
      - $ref: "#/components/parameters/username"
    get:
      tags: 
        - Social
      summary: Get the list of followers
      operationId: getFollowers
      description: Returns an array of usernames following the specified user. 
        Visible to any authenticated user, unless a ban exists between the two parties.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10000
                description: "List of users following the specified profile."
                items:
                  $ref: '#/components/schemas/Username'
        '401':
          description: Unauthorized - Token missing or invalid
        '403':
          description: Forbidden - Access denied due to a ban between the two users
        '404':
          description: Not Found - The specified user does not exist
        '500':
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Social
      summary: Follow a user
      description: |
        Creates a follow relationship between the authenticated user and the target user.
        The system must verify that no bans exist between the two parties.
      operationId: followUser
      responses:
        '204':
          description: User followed successfully.
        '401':
          description: Unauthorized - Invalid or missing token.
        '403':
          description: Forbidden - Cannot follow yourself or a ban is active.
        '404':
          description: Target user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Social
      summary: Unfollow a user
      description: |
        Removes the follow relationship between the authenticated user and the target user.
      operationId: unfollowUser
      responses:
        '204':
          description: User unfollowed successfully.
        '401':
          description: Unauthorized.
        '404':
          description: Target user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  
  /users/{username}/ban:
    parameters:
      - $ref: "#/components/parameters/username"
    get:
      tags: 
        - Social
      summary: Get the list of banned users
      description: Returns an array of usernames that the specified user has banned. Only the resource owner can access this list.
      operationId: getBannedUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10000
                description: "List of users currently banned by the authenticated user."
                items:
                  $ref: '#/components/schemas/Username'
        '401':
          description: Unauthorized - Token missing or invalid
        '403':
          description: Forbidden - You cannot view another user's ban list
        '404':
          description: Not Found - The specified user does not exist
        '500':
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Social
      summary: Ban a user
      description: Creates a ban relationship. The authenticated user (from token) blocks the target {username}.
        This action automatically removes any existing follow relationship between the two users.
      operationId: banUser
      responses:
        '204':
          description: User banned successfully or already banned.
        '401':
          description: Unauthorized - Token missing or invalid.
        '403':
          description: Forbidden - You cannot ban yourself.
        '404':
          description: Target user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Social
      summary: Unban a user
      description: |
        Removes the ban relationship for the target {username}.
      operationId: unbanUser
      responses:
        '204':
          description: User unbanned successfully.
        '401':
          description: Unauthorized.
        '404':
          description: Target user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
      
  /users/{username}/posts/{postId}/comments:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
    get:
      tags:
        - Comments
      summary: Get all comments of a post
      operationId: getComments
      description: Returns a list of comments. Access is blocked if a ban exists.
      responses:
        '200':
          description: A list of comments.
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10000
                description: "Chronological list of all comments published under the specified post."
                items:
                  $ref: "#/components/schemas/Comment"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Access blocked by a ban.
        '404':
          description: Post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Comments
      summary: Add a comment to a post
      operationId: addComment
      description: |
        Creates a new comment on a post. 
        Fails with 403 if the author is banned by the post owner or vice versa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentContent"
      responses:
        '201':
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Action blocked by a ban relationship.
        '404':
          description: Post or user not found.
        '500':
          $ref: "#/components/responses/InternalServerError"

  /users/{username}/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/postId"
      - $ref: "#/components/parameters/commentId"
    
    delete:
      tags:
        - Comments
      summary: Remove a comment
      operationId: deleteComment
      description: |
        Deletes a comment. 
        Only the comment author or the post owner can delete it.
      responses:
        '204':
          description: Comment deleted successfully.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - You do not have permission to delete this comment.
        '404':
          description: Comment or post not found.
        '500':
          $ref: "#/components/responses/InternalServerError"



