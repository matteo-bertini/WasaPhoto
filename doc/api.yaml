openapi: 3.0.0  
info:
  title: WasaPhoto APIs
  description: |
   Keep in touch with your friends by sharing photos of special moments, thanks to WASAPhoto! You can
   upload your photos directly from your PC, and they will be visible to everyone following you.
  version: 1.0.0
tags:
  - name: Account
    description: Authentication and session management
  - name: Profile
    description: User identity and social statistics
  - name: Social
    description: Following and banning logic
  - name: Posts
    description: Image uploading and posts management
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
          type: object
          description: The request body containing the user credentials (username and Password) required to authenticate an existing user or create a new account.
          title: LoginRequest
          required:
            - username
            - Password
            - IsSignUp
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^.*?$'
              description: The unique identifier for the user.
              example: Eren_Yeager
            Password:
              type: string
              format: password
              minLength: 8
              pattern: '^.*?$'
              description: The user's secret password
              example: "Secret123!"
            IsSignUp:
              type: boolean
              example: false
              description: Flag indicating whether the user is attempting a new registration (true) or a standard login (false).

    username:
          type: object
          description: A string that uniquely identifies the user's profile on WasaPhoto.
          title: username
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 30
              pattern: '^.*?$'
              description: The username 
              example: Eren_Yeager
    Comment:
      type: object
      title: comment
      description: a comment under a photo
      properties:
        CommentId:
          type: string
          description: The unnique comment identifier
          pattern: '^.*?$'
          example: "2NdYIM9PHBSyWdqk8LjxrVhg6Mv"
          minLength: 27
          maxLength:  27
        CommentAuthor:
          type: string
          description: The username of the author of the comment.
          example: "Eren_Yeager" 
          minLength: 3
          maxLength: 30
          pattern: '^.*?$'
        CommentText:
          type: string
          description: the text of the comment under a photo.
          minLength: 1
          maxLength: 2200
          pattern: '^.*?$'
          example: Awesome Photo! You are very cute :) !
    Like:
      type: object
      title: like
      description: a like on a photo
      properties:
        LikeId: 
          type: string
          description: The unique like identifier.
          example: "a5dhrwr5h12g577"
    Post:
      type: object
      properties:
        PostId:
          type: string
          example: "inenfnficnive"
        username:
          type: string
          example: "Eren_Yeager"
        Caption:
          type: string
          example: "A beautiful sunset"
        LikesNumber:
          type: integer
        CommentsNumber:
          type: integer
        DateOfUpload:
          type: string
          format: date-time
        IsLikedByMe:
          type: boolean
    UserProfile:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^.*?$'
          example: "Eren_Yeager"
          description: The username 
        Bio:
          type: string
          pattern: '^.*?$'
          example: "Hi I'm Eren_Yeager and I'm the Founding Titan :) "
          description: The username 
        FollowersCount:
          type: integer
        FollowingCount:
          type: integer
        PostsCount:
          type: integer
        IsFollowing:
          type: boolean
        IsBannedByMe:
          type: boolean
        UserPosts: 
          type: array
          items:
            $ref: "#/components/schemas/Post"
    PhotoStreamComponent:
      type: object
      title: PhotoStream component
      description: A single component in the photostream with pre-calculated stats.
      properties:
        PhotoId: 
          type: string
          example: "152164"
        username:
          type: string
          description: "Owner of the photo"
          example: "Eren_Yeager"
        LikesNumber:
          type: integer
          example: 15
        CommentsNumber:
          type: integer
          example: 3
        DateOfUpload:
          type: string
          format: date-time
          example: 2018-03-20T09:12:28Z
        IsLikedByMe:
          type: boolean
          description: "Indicates if the logged-in user has already liked this photo"
          example: true
  parameters: 
    username:
      name: username
      in: path
      required: true
      description: The username is a string that uniquely identifies a user in WasaPhoto.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    target_username:
      name: target_username
      in: path
      required: true
      description: The user receiving the action
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    actor_username:
      name: actor_username
      in: path
      required: true
      description: The user who performs the action
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Eren_Yeager
    PhotoId:
      name: PhotoId
      in: path
      required: true
      description: Photo Id
      schema:
        type: string
        description: An integer that represents the PhotoId.
        minLength: 3
        maxLength: 200
        pattern: '^.*?$'
        readOnly: true
        example: "152164"
    LikeId:
      name: LikeId
      in: path
      required: true
      description: Like Id
      schema:
        type: string
        description: A string (the username) that represents the LikeId.
        readOnly: true
        minLength: 27
        maxLength: 27
        pattern: '^.*?$'
        example: "2NdYIM9PHBSyWdqk8LjxrVhg6Mv"
    CommentId:
      name: CommentId
      in: path
      required: true
      description: Comment Id
      schema:
        type: integer
        description: An integer that represents the CommentId.
        readOnly: true
        example: 515
    FollowerId:
      name: FollowerId
      in: path
      required: true
      description: The FollowerId is a string (the username) that uniquely identifies a user in WasaPhoto.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        description:  A string of minimum 3 and maximum 30 characters representing the FollowerId. 
        pattern: '^.*?$'
        example: Founder_Titan_Official
    BannedId:
      name: BannedId
      in: path
      required: true
      description: The BannedId is a string (the username) that uniquely identifies a user in WasaPhoto.
      schema:
        type: string
        description:  A string of minimum 3 and maximum 30 characters representing the BannedId.
        minLength: 3
        maxLength: 30
        pattern: '^.*?$'
        example: Founder_Titan_Official
    Limit:
      name: limit
      in: query
      description: Numero massimo di foto da restituire
      schema:
        type: integer
        default: 10
    Offset:
      name: offset
      in: query
      description: Numero di foto da saltare (per la pagina successiva)
      schema:
        type: integer
        default: 0
  responses:
    BadRequest:
      description: |
        Bad Request : The request was not compliant with the documentation
        (eg. missing fields, etc).
    InternalServerError:
      description: |
        Internal Server Error : The server encountered an internal error.
        Further info in server logs.      
paths:
  /session:
    post:
      tags:
        - Account
      summary: Logs in or registers the user
      description: | 
        If the user does not exist, a new account and profile are created (Sign Up).
        If the user exists, credentials are verified (Login).
        In both cases, a temporary session token is returned.
      operationId: doLogin
      requestBody:
        description: User credentials for authentication
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: |
            Ok : User log-in action successful
          content:
            application/json:
              schema:
                type: object
                description: an object
                properties:
                  Identifier:
                    type: string
                    description: the identifier
                    example: "abcdef012345"
        '201':
          description: |
            Created : User log-in action successful, a new user is created
          content:
            application/json:
              schema:
                type: object
                description: an object
                properties:
                  Identifier:
                    type: string
                    description: the identifier
                    example: "abcdef012345"
        '400':
          $ref: "#/components/responses/BadRequest"

          
        '401':
          description: |
            Unauthorized: Invalid username or password. 
            For security reasons, the system does not specify if the username 
            exists or if the password is incorrect. 
        '409':
          description: |
            Conflict: username already taken during signup
        '500':
          $ref: "#/components/responses/InternalServerError"  
    
    delete:
      tags:
        - Account
      security:
        - bearerAuth: [] 
      operationId: doLogout
      summary: Logout the current user
      responses:
        '204':
          description: User successfully logged out (No Content)
        '401':
          description: Unauthorized - Invalid or missing token
        '500':
          description: Internal server error

  
  /users/{username}:
    get:
      tags:
        - Profile
      security:
        - bearerAuth : []
      operationId: getUserProfile
      summary: Get user profile data
      description: |
        Returns the profile details, statistics, and photos of the specified user.
        If the requester is banned by the owner (or vice versa), it returns a 403 Forbidden.
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the profile to retrieve.
          schema:
            type: string
            minLength: 3
            maxLength: 30
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Access denied due to blocking/banning.
        '404':
          description: Not Found - User does not exist.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/:
    parameters:
      - $ref: "#/components/parameters/username"
    delete:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: deleteUser
      summary: Delete a user.
      description: |
        Deletes the user with the specified username.
      responses:
        '204':
          description: Delete successfully performed.
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          description: |
            NotFound : User with specified username not found in the system.
        '500':
          $ref: "#/components/responses/InternalServerError"  
  /users/{username}/stream:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
    get:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: getMyStream
      summary: Ottiene lo stream personalizzato
      description: |
        Restituisce le foto caricate dagli utenti seguiti in ordine cronologico inverso.
        Supporta la paginazione tramite limit e offset.
      responses:
        '200': 
          description: OK
          content: 
            application/json:
              schema:
                type: object
                properties:
                  PhotoStream:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoStreamComponent"
                  TotalResults:
                    type: integer
                    description: Numero totale di post disponibili nello stream
        '403':
          description: Forbidden - Non puoi vedere lo stream di questo utente (es. ban)
        '404':
          description: Utente non trovato
  /users/{username}/username:
    parameters:
      - $ref: "#/components/parameters/username"
    put:
      tags:
        - user
      security:
        - bearerAuth : []
      operationId: setMyusername
      summary: Modify the username of the given user.
      description: |
        Modifies an existing user by replacing the old username 
        with the new username contained in the request body.
        The new username will be returned in the response.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/username"
      responses:
        '200':
          description: |
            OK : username successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/username"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':  
          description: |
            Unauthorized : The id passed does not authorize the user to perform the operation.
        '404':
          description: |
            NotFound : User not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/posts:
    parameters:
      - $ref: "#/components/parameters/username"
    post:
      tags:
        - Posts
      summary: Uploads a new post
      description: |
        Creates a new post containing an image and an optional caption.
        The 'username' in the path must match the identity of the authenticated user.
        The image is sent as a binary part of a multipart/form-data request.
      operationId: uploadPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "The image file to upload (supported formats: JPEG, PNG.)"
                caption:
                  type: string
                  description: An optional description for the post.
                  maxLength: 500
              required:
                - file
      responses:
        '201':
          description: Post created successfully. Returns the new post metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        '400':
          description: Bad Request. Possible causes include invalid file format, file too large, or missing mandatory fields.
        '401':
          description: Unauthorized. Invalid or missing session token.
        '403':
          description: Forbidden. The authenticated user is not allowed to post as the specified username.
        '404':
          description: User not found.
        '500':
          description: Internal Server Error.
  /users/{username}/photos/{PhotoId}/:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags:
        - photos
      operationId : getPhoto
      summary: Gets the photo with the specified Id
      description: |
        Gets the photo with the specified Id
      responses:
        '200': 
          description: Request fullfilled.
          content:
            image/png:
              schema:
                type: string
                format: binary
                description: The Photo
            
        '400': 
           $ref: "#/components/responses/BadRequest"
        '401':
          description: |
            Unauthorized : The id specified in the authorization does not allow the operation to be performed (the id does not match with a registered user).
        '403':
          description: |
            Forbidden :  The request is formulated correctly, but cannot be granted for one of the following reasons:

            - The id passed in the Authorization corresponds to a User (with an existing profile) that can't see the photo. (has banned the user in the url or was banned by the user in the url).
            - The id passed in the Authorization corresponds to an registered user but with no existing profile.
            
        '404':
          description: |
            Not Found : the request cannot be granted for one of the following reasons:
            - The user in the URL doesn't exist.
            - The photo in the URL does not exist.
        '500':
          $ref: "#/components/responses/InternalServerError"  
          
    delete:
      tags:
        - photos
      security:
        - bearerAuth : []
      operationId: deletePhoto
      summary: Deletes a photo from the user uploaded photos.
      description: |
        Deletes the photo with the specified id from the system.
      responses:
        '204':
          description: |
            No Content : Photo deleted successfully.
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          description: |
            Unauthorized : The id passed is not allowed to delete this photo.
        '404':
          description: | 
            Not Found : Photo with specified Id not found.
        '500':
          $ref: "#/components/responses/InternalServerError"
  /users/{username}/photos/{PhotoId}/likes/:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/PhotoId"
    post:
      tags:
        - photos
      security:
        - bearerAuth : []
      operationId: likePhoto
      summary: Like a specific photo
      description: |
        Adds a like to the list of likes of the specific photo,using the object in the requestBody. 
        The likes counter of the specific photo will also be increased by one.
      responses:
        '201':
          description: |
            Created : Like posted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Like"
        '403':
          description: |
            Forbidden : The request is formulated correctly, but cannot be granted for one of the following reasons:

            - The id passed in the Authorization corresponds to a User (with an existing profile) that can't put the like on the photo. (has banned the user in the url or was banned by the user in the url).
            - The id passed in the Authorization corresponds to an registered user but with no existing profile.
            - The id passed in the Authorization corresponds to a profile that already likes the photo.
        '404':
          description: |
            Not Found : the request cannot be granted for one of the following reasons:

            - The user in the URL doesn't exist.
            - The photo in the URL does not exist.
        '401': 
          description: |
            Unauthorized : The user is not authorized to put a like on the photo.
        '500':
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - photos
      operationId: getLikes
      summary: Get the list of likes of a specific photo
      description: |
        Returns a collection of likes of a specific photo.
      responses:
        '200': 
          description: |
            OK : Request fullfilled.
          content: 
            application/json:
              schema:
                type: object
                title: Likes
                description: The Likes on a Photo
                properties:
                  Likes:
                    type: array
                    description: The array that contains the list of likes
                    title: Likes
                    minItems : 0
                    maxItems : 10000000
                    items:
                      $ref: "#/components/schemas/username"
        '500':
          $ref: "#/components/responses/InternalServerError"       
  /users/{username}/photos/{PhotoId}/likes/{Likerusername}:
    delete:
      tags:
        - photos
      summary: "Rimuove un like dalla foto"
      operationId: unlikePhoto
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: "Proprietario della foto"
          schema:
            type: string
        - name: PhotoId
          in: path
          required: true
          schema:
            type: string
        - name: Likerusername
          in: path
          required: true
          description: "username di chi sta togliendo il like (solitamente l'utente loggato)"
          schema:
            type: string
      responses:
        '204':
          description: "Like rimosso con successo"
        '401':
          description: "Non autorizzato"
        '404':
          description: "Foto o Like non trovato"
        '500':
          description: "Errore interno del server"
  /users/{username}/photos/{PhotoId}/comments/:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/PhotoId"
    post:
      tags:
        - photos
      security:
        - bearerAuth : []
      operationId: commentPhoto
      summary: comment a specific photo
      description: |
        Adds a comment to the list of comments of the specific photo,using the object in the requestBody.
        The server will create a unique CommentId,the client can find it in the response.
        The comments counter of the specific photo will also be increased by one.
      requestBody: 
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment"
      responses:
        '201':
          description: |
            Created : Comment posted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':  
          description: |
            Not Found : username or Photo in the URL does not exists.
        '401':
          description: |
            Unauthorized : The user is not authorized to perform the operation.
        '500':
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - photos
      operationId: getComments
      summary: Get the list of comments on a specific photo
      description: |
        Returns a collection of comments of a specific photo.
      responses:
        '200': 
          description: |
            OK : Request fullfilled.
          content: 
             application/json:
              schema:
                type: object
                title: comments
                description: The comments on a Photo
                properties:
                  Comments:
                    type: array
                    description: The array that contains the list of comments
                    title: Likes
                    minItems : 0
                    maxItems : 10000000
                    items:
                      $ref: "#/components/schemas/Comment"
        '404':
          description: |
            Not Found : The photo specified in the URL does not exist.
        '500':
          $ref: "#/components/responses/InternalServerError"  
  /users/{username}/photos/{PhotoId}/comments/{CommentId}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/PhotoId"
      - $ref: "#/components/parameters/CommentId"
    delete:
      tags:
        - photos
      security:
        - bearerAuth : []
      operationId: uncommentPhoto
      summary: deletes a comment on a specific photo. 
      description: |
        Deletes the comment with the specified id from the list of comments of a specific photo.
        Only the author of the comment can delete his comment.
      responses:
        '204':
          description: Comment removed successfully.
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          description: Comment with specified Id not found in the system.
        '500':
          $ref: "#/components/responses/InternalServerError"
  
  /users/{username}/followers/{actor_username}:
    parameters:
      - $ref: "#/components/parameters/username"
      - $ref: "#/components/parameters/actor_username"
    put:
      tags:
        - Social
      summary: Follow a user
      description: |
        Creates a follow relationship between the actor and the target user.
        The actor_username must match the authenticated user's identity.
      operationId: followUser
      responses:
        '204':
          description: User followed successfully.
        '401':
          description: Unauthorized (invalid or missing session token).
        '403':
          description: Forbidden (e.g. a ban exists).
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.

    delete:
      tags:
        - Social
      summary: Unfollow a user
      description: |
        Removes the follow relationship between the actor and the target user.
      operationId: unfollowUser
      parameters:
        - $ref: '#/components/parameters/target_username'
        - $ref: '#/components/parameters/actor_username'
      responses:
        '204':
          description: User unfollowed successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden .
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.
  
  /users/{username}/bans/{target_username}:
    parameters:
      - $ref: "#/components/parameters/target_username"
      - $ref: "#/components/parameters/username"
    put:
      tags:
        - Social
      summary: Bans a user
      description: |
        Creates a ban relationship between the actor and the target user.
        The actor_username must match the authenticated user's identity.
      operationId: banUser
      responses:
        '204':
          description: User banned successfully.
        '401':
          description: Unauthorized (invalid or missing session token).
        '403':
          description: Forbidden (e.g. a ban exists).
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.

    delete:
      tags:
        - Social
      summary: Unbans a user
      description: |
        Removes the ban relationship between the actor and the target user.
      operationId: unbanUser
      responses:
        '204':
          description: User unbanned successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Target user or actor user not found.
        '500':
          description: Internal server error.
      

    
  



    




  
    

      
    
      
      









